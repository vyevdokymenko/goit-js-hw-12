<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla App Template</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main>
      <section class="search-section">
        <form class="form">
          <label for="search-text">
            <input
              type="text"
              name="search-text"
              placeholder="Search images..."
              id="search-text"
              required
            >
          </label>
          <button type="submit" class="submit-button button">Search</button>
        </form>
      </section>
      <section class="results-section">
        <ul class="gallery"></ul>
        <div class="loader-container hidden">
          <span class="loader"></span>
        </div>
        <div class="load-more-container">
          <div class="load-more-display hidden">
            <button class="load-more button">Load more</button>
          </div>
          <div class="end-of-search-display hidden">
            <p class="end-of-search">We're sorry, but you've reached the end of search results.</p>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
